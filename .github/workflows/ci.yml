name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SWIFT_VERSION: 6.3.3

jobs:
  macos:
    name: macOS build & test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - uses: actions/cache@v4
        with:
          path: .build
          key: macos-spm-${{ hashFiles('Package.swift') }}
          restore-keys: macos-spm-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

  linux:
    name: Linux build & test
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - uses: actions/cache@v4
        with:
          path: .build
          key: linux-spm-${{ hashFiles('Package.swift') }}
          restore-keys: linux-spm-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

      # Runs the same tests on swift-observation's own `@Observable`, the one an
      # Embedded build always uses.
      - name: Test with EmbeddedObservation
        run: swift test --traits EmbeddedObservation

  wasm:
    name: WASM ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core must stay Embedded Swift compatible (see AGENTS.md).
          - name: embedded (SwiftWebUI)
            sdk: wasm-embedded
            target: SwiftWebUI
          # The browser runtime, built against the full WASI SDK.
          - name: runtime (SwiftWebUIRuntime)
            sdk: wasm
            target: SwiftWebUIRuntime
          # The browser runtime in Embedded Swift. JavaScriptKit only builds its
          # Embedded variant when this environment variable is set.
          - name: embedded runtime (SwiftWebUIRuntime)
            sdk: wasm-embedded
            target: SwiftWebUIRuntime
            embedded_javascriptkit: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift SDK for WebAssembly
        run: |
          apt-get update -qq && apt-get install -y -qq curl >/dev/null
          bundle="swift-${SWIFT_VERSION}-RELEASE_wasm.artifactbundle.tar.gz"
          curl -fsSL -o "/tmp/${bundle}" \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/wasm-sdk/swift-${SWIFT_VERSION}-RELEASE/${bundle}"
          swift sdk install "/tmp/${bundle}"
          swift sdk list

      - uses: actions/cache@v4
        with:
          path: .build
          key: wasm-${{ matrix.sdk }}-${{ matrix.target }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: wasm-${{ matrix.sdk }}-${{ matrix.target }}-spm-

      - name: Build
        env:
          JAVASCRIPTKIT_EXPERIMENTAL_EMBEDDED_WASM: ${{ matrix.embedded_javascriptkit || 'false' }}
        run: >
          swift build
          --target ${{ matrix.target }}
          --swift-sdk swift-${SWIFT_VERSION}-RELEASE_${{ matrix.sdk }}

  # A whole application, in release, in Embedded Swift. Building the targets
  # alone, in debug, misses what only shows once an app's views specialize the
  # runtime's generic code: an untyped throw in `mount`, and a Swift 6.3.3
  # optimizer crash that -O alone triggers.
  embedded-app:
    name: WASM embedded app (Starter, release)
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift SDK for WebAssembly
        run: |
          apt-get update -qq && apt-get install -y -qq curl >/dev/null
          bundle="swift-${SWIFT_VERSION}-RELEASE_wasm.artifactbundle.tar.gz"
          curl -fsSL -o "/tmp/${bundle}" \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/wasm-sdk/swift-${SWIFT_VERSION}-RELEASE/${bundle}"
          swift sdk install "/tmp/${bundle}"

      - uses: actions/cache@v4
        with:
          path: Examples/Starter/.build
          key: wasm-embedded-starter-spm-${{ hashFiles('Package.swift', 'Examples/Starter/Package.swift') }}
          restore-keys: wasm-embedded-starter-spm-

      # The same two commands the README gives an application: compile, then
      # assemble dist/.
      - name: Build and assemble
        working-directory: Examples/Starter
        env:
          JAVASCRIPTKIT_EXPERIMENTAL_EMBEDDED_WASM: "true"
        run: |
          swift package --swift-sdk swift-${SWIFT_VERSION}-RELEASE_wasm-embedded js -c release
          swift package --allow-writing-to-package-directory web

      - uses: actions/upload-artifact@v4
        with:
          name: starter-embedded
          path: Examples/Starter/dist
          retention-days: 7

  # Opens that bundle in Chromium and presses its button. A bundle that builds
  # can still fail at runtime under Embedded Swift: missing JavaScriptKit
  # exports, or a main actor nothing runs.
  embedded-app-browser:
    name: WASM embedded app in a browser (Starter)
    needs: embedded-app
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: starter-embedded
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Press the button
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory dist > /dev/null 2>&1 &
          sleep 1
          node .github/scripts/starter-smoke-test.mjs http://127.0.0.1:8080/ starter.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starter-screenshot
          path: starter.png
          retention-days: 7
